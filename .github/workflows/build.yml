name: Build C++ Project

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild themida-deobf.sln /p:Configuration=Release /p:Platform=x64 /p:IncludePath="$(MSBuildProjectDirectory)\ThemidaProject;$(MSBuildProjectDirectory)\zasm\include"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: themida-deobf-exe
        path: |
          **/Release/*.exe
          **/x64/Release/*.exe
