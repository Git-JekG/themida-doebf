name: Build C++ Project

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build zasm via CMake
      run: |
        cmake -S zasm -B zasm/build -A x64
        cmake --build zasm/build --config Release

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Themida Project
      env:
        CL: "/I\"${{ github.workspace }}\\ThemidaProject\" /I\"${{ github.workspace }}\\zasm\\include\""
      run: msbuild ThemidaProject/ThemidaProject.vcxproj /p:Configuration=Release /p:Platform=x64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: themida-deobf-exe
        path: |
          **/Release/*.exe
          **/x64/Release/*.exe
